name: Build & Release (Android Optimized)

on:
  workflow_dispatch:
    inputs:
      build_bundle:
        description: 'Build App Bundle (.aab) instead of split APKs'
        type: boolean
        default: false
      create_release:
        description: 'Create a GitHub Release'
        type: boolean
        default: false

jobs:
  version:
    name: Extract Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: get-version
        shell: bash
        run: |
          VER=$(grep '^version: ' pubspec.yaml | sed 's/version: //' | tr -d ' ')
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Version: $VER"

  build-android-optimized:
    name: Build Android Optimized (R8 & Obfuscated)
    runs-on: ubuntu-latest
    needs: [version]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          cache: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: "aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android"

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Build Rust Library (Android)
        run: |
          cd PQ-DR
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 build --release
          mkdir -p ../android/app/src/main/jniLibs/arm64-v8a
          mkdir -p ../android/app/src/main/jniLibs/armeabi-v7a
          mkdir -p ../android/app/src/main/jniLibs/x86_64
          cp target/aarch64-linux-android/release/libpq_aura.so ../android/app/src/main/jniLibs/arm64-v8a/
          cp target/armv7-linux-androideabi/release/libpq_aura.so ../android/app/src/main/jniLibs/armeabi-v7a/
          cp target/x86_64-linux-android/release/libpq_aura.so ../android/app/src/main/jniLibs/x86_64/

      - name: Install dependencies
        run: flutter pub get

      - name: Run Build Runner
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Create .env from secrets
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env
          echo "SENTRY_DSN=${{ secrets.SENTRY_DSN }}" >> .env
          echo "GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }}" >> .env
          echo "GIPHY_WEB_KEY=${{ secrets.GIPHY_WEB_KEY }}" >> .env
          echo "GIPHY_ANDROID_KEY=${{ secrets.GIPHY_ANDROID_KEY }}" >> .env
          echo "GIPHY_IOS_KEY=${{ secrets.GIPHY_IOS_KEY }}" >> .env
          echo "GIPHY_WINDOWS_KEY=${{ secrets.GIPHY_WINDOWS_KEY }}" >> .env
          echo "GIPHY_MACOS_KEY=${{ secrets.GIPHY_MACOS_KEY }}" >> .env
          echo "KLIPY_WEB_KEY=${{ secrets.KLIPY_WEB_KEY }}" >> .env
          echo "KLIPY_ANDROID_KEY=${{ secrets.KLIPY_ANDROID_KEY }}" >> .env
          echo "KLIPY_IOS_KEY=${{ secrets.KLIPY_IOS_KEY }}" >> .env
          echo "KLIPY_WINDOWS_KEY=${{ secrets.KLIPY_WINDOWS_KEY }}" >> .env
          echo "KLIPY_MACOS_KEY=${{ secrets.KLIPY_MACOS_KEY }}" >> .env
          echo "REVENUECAT_GOOGLE_API_KEY=${{ secrets.REVENUECAT_GOOGLE_API_KEY }}" >> .env
          echo "REVENUECAT_APPLE_API_KEY=${{ secrets.REVENUECAT_APPLE_API_KEY }}" >> .env
          echo "R2_ACCOUNT_ID=${{ secrets.R2_ACCOUNT_ID }}" >> .env
          echo "R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }}" >> .env
          echo "R2_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY }}" >> .env
          echo "B2_ENDPOINT=${{ secrets.B2_ENDPOINT }}" >> .env
          echo "B2_ACCESS_KEY_ID=${{ secrets.B2_ACCESS_KEY_ID }}" >> .env
          echo "B2_SECRET_ACCESS_KEY=${{ secrets.B2_SECRET_ACCESS_KEY }}" >> .env

      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore

      - name: Build Optimized Android Binary
        env:
          RELEASE_STORE_FILE: "release.keystore"
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p build/app/outputs/symbols
          if [ "${{ github.event.inputs.build_bundle }}" = "true" ]; then
            flutter build appbundle --release --obfuscate --split-debug-info=build/app/outputs/symbols --tree-shake-icons --dart-define-from-file=".env"
          else
            flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/app/outputs/symbols --tree-shake-icons --dart-define-from-file=".env"
          fi

      - name: Rename Artifacts with version
        run: |
          VER="${{ needs.version.outputs.version }}"
          mkdir -p release-artifacts
          if [ "${{ github.event.inputs.build_bundle }}" = "true" ]; then
            cp build/app/outputs/bundle/release/app-release.aab "release-artifacts/oasis-v${VER}-optimized.aab" || cp build/app/outputs/bundle/release/*.aab "release-artifacts/oasis-v${VER}-optimized.aab"
          else
            for f in build/app/outputs/flutter-apk/*-release.apk; do
              ABI=$(echo "$f" | sed -E 's/.*app-(.*)-release\.apk/\1/')
              cp "$f" "release-artifacts/oasis-v${VER}-${ABI}-optimized.apk"
            done
            if [ -f "build/app/outputs/flutter-apk/app-arm64-v8a-release.apk" ]; then
              cp "build/app/outputs/flutter-apk/app-arm64-v8a-release.apk" "release-artifacts/oasis-v${VER}-optimized.apk"
            fi
          fi

      - name: Upload Optimized Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-optimized-binaries
          path: release-artifacts/
          retention-days: 7

      - name: Upload Debug Symbols
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-symbols
          path: build/app/outputs/symbols/
          retention-days: 14
