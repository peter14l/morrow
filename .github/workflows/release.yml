name: Build & Release

on:
  push:
    branches: [ 'main' ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ 'main' ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub Release'
        type: boolean
        default: false

jobs:
  # ── Shared: Extract version ─────────────────────────────────────────────
  version:
    name: Extract Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: get-version
        shell: bash
        run: |
          VER=$(grep '^version: ' pubspec.yaml | sed 's/version: //' | tr -d ' ')
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Version: $VER"

  # ── Android ─────────────────────────────────────────────────────────────
  build-android:
    name: Build Android (APK)
    runs-on: ubuntu-latest
    needs: [version]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          cache: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: "aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android"

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Build Rust Library (Android)
        run: |
          cd PQ-DR
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 build --release
          mkdir -p ../android/app/src/main/jniLibs/arm64-v8a
          mkdir -p ../android/app/src/main/jniLibs/armeabi-v7a
          mkdir -p ../android/app/src/main/jniLibs/x86_64
          cp target/aarch64-linux-android/release/libpq_aura.so ../android/app/src/main/jniLibs/arm64-v8a/
          cp target/armv7-linux-androideabi/release/libpq_aura.so ../android/app/src/main/jniLibs/armeabi-v7a/
          cp target/x86_64-linux-android/release/libpq_aura.so ../android/app/src/main/jniLibs/x86_64/

      - name: Install dependencies
        run: flutter pub get

      - name: Run Build Runner
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Create .env from secrets
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env
          echo "SENTRY_DSN=${{ secrets.SENTRY_DSN }}" >> .env
          echo "GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }}" >> .env
          echo "GIPHY_WEB_KEY=${{ secrets.GIPHY_WEB_KEY }}" >> .env
          echo "GIPHY_ANDROID_KEY=${{ secrets.GIPHY_ANDROID_KEY }}" >> .env
          echo "GIPHY_IOS_KEY=${{ secrets.GIPHY_IOS_KEY }}" >> .env
          echo "GIPHY_WINDOWS_KEY=${{ secrets.GIPHY_WINDOWS_KEY }}" >> .env
          echo "GIPHY_MACOS_KEY=${{ secrets.GIPHY_MACOS_KEY }}" >> .env
          echo "KLIPY_WEB_KEY=${{ secrets.KLIPY_WEB_KEY }}" >> .env
          echo "KLIPY_ANDROID_KEY=${{ secrets.KLIPY_ANDROID_KEY }}" >> .env
          echo "KLIPY_IOS_KEY=${{ secrets.KLIPY_IOS_KEY }}" >> .env
          echo "KLIPY_WINDOWS_KEY=${{ secrets.KLIPY_WINDOWS_KEY }}" >> .env
          echo "KLIPY_MACOS_KEY=${{ secrets.KLIPY_MACOS_KEY }}" >> .env
          echo "REVENUECAT_GOOGLE_API_KEY=${{ secrets.REVENUECAT_GOOGLE_API_KEY }}" >> .env
          echo "REVENUECAT_APPLE_API_KEY=${{ secrets.REVENUECAT_APPLE_API_KEY }}" >> .env
          echo "R2_ACCOUNT_ID=${{ secrets.R2_ACCOUNT_ID }}" >> .env
          echo "R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }}" >> .env
          echo "R2_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY }}" >> .env
          echo "B2_ENDPOINT=${{ secrets.B2_ENDPOINT }}" >> .env
          echo "B2_ACCESS_KEY_ID=${{ secrets.B2_ACCESS_KEY_ID }}" >> .env
          echo "B2_SECRET_ACCESS_KEY=${{ secrets.B2_SECRET_ACCESS_KEY }}" >> .env

      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore

      - name: Build Release APKs (Split per ABI)
        env:
          RELEASE_STORE_FILE: "release.keystore"
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          flutter build apk --release --split-per-abi --no-shrink --dart-define-from-file=".env"

      - name: Rename APKs with version
        run: |
          VER="${{ needs.version.outputs.version }}"
          mkdir -p release-artifacts
          for f in build/app/outputs/flutter-apk/*-release.apk; do
            ABI=$(echo "$f" | sed -E 's/.*app-(.*)-release\.apk/\1/')
            cp "$f" "release-artifacts/oasis-v${VER}-${ABI}.apk"
          done
          cp "build/app/outputs/flutter-apk/app-arm64-v8a-release.apk" "release-artifacts/oasis-v${VER}-android-arm64.apk"

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: release-artifacts/
          retention-days: 7


  # ── iOS ─────────────────────────────────────────────────────────────────
  build-ios:
    name: Build iOS (IPA)
    runs-on: macos-latest
    needs: [version]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          cache: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: "aarch64-apple-ios, x86_64-apple-ios"

      - name: Build Rust Library (iOS)
        run: |
          cd PQ-DR
          rustup target add aarch64-apple-ios x86_64-apple-ios
          cargo build --target aarch64-apple-ios --release
          cargo build --target x86_64-apple-ios --release
          cd ..
          mkdir -p ios/libs
          lipo -create \
            PQ-DR/target/aarch64-apple-ios/release/libpq_aura.a \
            PQ-DR/target/x86_64-apple-ios/release/libpq_aura.a \
            -output ios/libs/libpq_aura.a

      - name: Precache iOS artifacts
        run: flutter precache --ios

      - name: Disable Swift Package Manager
        run: flutter config --no-enable-swift-package-manager

      - name: Clean build environment
        run: |
          flutter clean
          rm -rf ios/Pods ios/Podfile.lock ios/.symlinks

      - name: Install dependencies
        run: flutter pub get

      - name: Create .env from secrets
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env
          echo "SENTRY_DSN=${{ secrets.SENTRY_DSN }}" >> .env
          echo "GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }}" >> .env
          echo "GIPHY_WEB_KEY=${{ secrets.GIPHY_WEB_KEY }}" >> .env
          echo "GIPHY_ANDROID_KEY=${{ secrets.GIPHY_ANDROID_KEY }}" >> .env
          echo "GIPHY_IOS_KEY=${{ secrets.GIPHY_IOS_KEY }}" >> .env
          echo "GIPHY_WINDOWS_KEY=${{ secrets.GIPHY_WINDOWS_KEY }}" >> .env
          echo "GIPHY_MACOS_KEY=${{ secrets.GIPHY_MACOS_KEY }}" >> .env
          echo "KLIPY_WEB_KEY=${{ secrets.KLIPY_WEB_KEY }}" >> .env
          echo "KLIPY_ANDROID_KEY=${{ secrets.KLIPY_ANDROID_KEY }}" >> .env
          echo "KLIPY_IOS_KEY=${{ secrets.KLIPY_IOS_KEY }}" >> .env
          echo "KLIPY_WINDOWS_KEY=${{ secrets.KLIPY_WINDOWS_KEY }}" >> .env
          echo "KLIPY_MACOS_KEY=${{ secrets.KLIPY_MACOS_KEY }}" >> .env
          echo "R2_ACCOUNT_ID=${{ secrets.R2_ACCOUNT_ID }}" >> .env
          echo "R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }}" >> .env
          echo "R2_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY }}" >> .env
          echo "B2_ENDPOINT=${{ secrets.B2_ENDPOINT }}" >> .env
          echo "B2_ACCESS_KEY_ID=${{ secrets.B2_ACCESS_KEY_ID }}" >> .env
          echo "B2_SECRET_ACCESS_KEY=${{ secrets.B2_SECRET_ACCESS_KEY }}" >> .env

      - name: Build iOS
        run: |
          flutter build ios --release --no-codesign --dart-define-from-file=".env"

      - name: Package IPA
        run: |
          VER="${{ needs.version.outputs.version }}"
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          codesign --force --deep --sign - Payload/Runner.app
          zip -r "oasis-v${VER}-ios.ipa" Payload
          mkdir -p release-artifacts
          cp "oasis-v${VER}-ios.ipa" release-artifacts/

      - name: Upload iOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: release-artifacts/
          retention-days: 7


  # ── macOS ───────────────────────────────────────────────────────────────
  build-macos:
    name: Build macOS (App)
    runs-on: macos-latest
    needs: [version]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: "aarch64-apple-darwin, x86_64-apple-darwin"

      - name: Build Rust Library (macOS)
        run: |
          cd PQ-DR
          cargo build --target aarch64-apple-darwin --release
          cargo build --target x86_64-apple-darwin --release
          cd ..
          mkdir -p macos/libs
          lipo -create \
            PQ-DR/target/aarch64-apple-darwin/release/libpq_aura.dylib \
            PQ-DR/target/x86_64-apple-darwin/release/libpq_aura.dylib \
            -output macos/libs/libpq_aura.dylib

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          cache: true

      - name: Precache macOS artifacts
        run: flutter precache --macos

      - name: Disable Swift Package Manager
        run: |
          flutter config --no-enable-swift-package-manager
          flutter clean
          rm -rf macos/Pods macos/Podfile.lock macos/.symlinks

      - name: Install dependencies
        run: flutter pub get

      - name: Create .env from secrets
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env
          echo "SENTRY_DSN=${{ secrets.SENTRY_DSN }}" >> .env
          echo "GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }}" >> .env
          echo "GIPHY_WEB_KEY=${{ secrets.GIPHY_WEB_KEY }}" >> .env
          echo "GIPHY_ANDROID_KEY=${{ secrets.GIPHY_ANDROID_KEY }}" >> .env
          echo "GIPHY_IOS_KEY=${{ secrets.GIPHY_IOS_KEY }}" >> .env
          echo "GIPHY_WINDOWS_KEY=${{ secrets.GIPHY_WINDOWS_KEY }}" >> .env
          echo "GIPHY_MACOS_KEY=${{ secrets.GIPHY_MACOS_KEY }}" >> .env
          echo "KLIPY_WEB_KEY=${{ secrets.KLIPY_WEB_KEY }}" >> .env
          echo "KLIPY_ANDROID_KEY=${{ secrets.KLIPY_ANDROID_KEY }}" >> .env
          echo "KLIPY_IOS_KEY=${{ secrets.KLIPY_IOS_KEY }}" >> .env
          echo "KLIPY_WINDOWS_KEY=${{ secrets.KLIPY_WINDOWS_KEY }}" >> .env
          echo "KLIPY_MACOS_KEY=${{ secrets.KLIPY_MACOS_KEY }}" >> .env
          echo "R2_ACCOUNT_ID=${{ secrets.R2_ACCOUNT_ID }}" >> .env
          echo "R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }}" >> .env
          echo "R2_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY }}" >> .env
          echo "B2_ENDPOINT=${{ secrets.B2_ENDPOINT }}" >> .env
          echo "B2_ACCESS_KEY_ID=${{ secrets.B2_ACCESS_KEY_ID }}" >> .env
          echo "B2_SECRET_ACCESS_KEY=${{ secrets.B2_SECRET_ACCESS_KEY }}" >> .env

      - name: Build macOS
        run: flutter build macos --release --dart-define-from-file=".env"

      - name: Package macOS App
        run: |
          VER="${{ needs.version.outputs.version }}"
          mkdir -p release-artifacts
          ditto -c -k --sequesterRsrc --keepParent \
            build/macos/Build/Products/Release/Runner.app \
            "release-artifacts/oasis-v${VER}-macos.zip"

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: release-artifacts/
          retention-days: 7


  # ── Windows ─────────────────────────────────────────────────────────────
  build-windows:
    name: Build Windows (MSIX)
    runs-on: windows-latest
    needs: [version]

    steps:
      - name: Enable long paths in Git
        run: git config --global core.longpaths true

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          cache: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Rust Library (Windows)
        shell: pwsh
        run: |
          cd PQ-DR
          cargo build --release
          cd ..
          if (!(Test-Path "windows/libs")) { New-Item -ItemType Directory -Path "windows/libs" }
          Copy-Item "PQ-DR/target/release/pq_aura.dll" -Destination "windows/libs/"

      - name: Install dependencies
        run: flutter pub get

      - name: Create .env from secrets
        shell: pwsh
        run: |
          "@" > .env
          "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env
          "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env
          "SENTRY_DSN=${{ secrets.SENTRY_DSN }}" >> .env
          "GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }}" >> .env
          "GIPHY_WEB_KEY=${{ secrets.GIPHY_WEB_KEY }}" >> .env
          "GIPHY_ANDROID_KEY=${{ secrets.GIPHY_ANDROID_KEY }}" >> .env
          "GIPHY_IOS_KEY=${{ secrets.GIPHY_IOS_KEY }}" >> .env
          "GIPHY_WINDOWS_KEY=${{ secrets.GIPHY_WINDOWS_KEY }}" >> .env
          "GIPHY_MACOS_KEY=${{ secrets.GIPHY_MACOS_KEY }}" >> .env
          "KLIPY_WEB_KEY=${{ secrets.KLIPY_WEB_KEY }}" >> .env
          "KLIPY_ANDROID_KEY=${{ secrets.KLIPY_ANDROID_KEY }}" >> .env
          "KLIPY_IOS_KEY=${{ secrets.KLIPY_IOS_KEY }}" >> .env
          "KLIPY_WINDOWS_KEY=${{ secrets.KLIPY_WINDOWS_KEY }}" >> .env
          "KLIPY_MACOS_KEY=${{ secrets.KLIPY_MACOS_KEY }}" >> .env
          "R2_ACCOUNT_ID=${{ secrets.R2_ACCOUNT_ID }}" >> .env
          "R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }}" >> .env
          "R2_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY }}" >> .env
          "B2_ENDPOINT=${{ secrets.B2_ENDPOINT }}" >> .env
          "B2_ACCESS_KEY_ID=${{ secrets.B2_ACCESS_KEY_ID }}" >> .env
          "B2_SECRET_ACCESS_KEY=${{ secrets.B2_SECRET_ACCESS_KEY }}" >> .env

      - name: Disable sentry-native (avoid crashpad 403 error)
        run: |
          echo "SENTRY_NATIVE_BACKEND=none" >> .env

      - name: Build Windows
        run: flutter build windows --release --dart-define-from-file=".env"
        env:
          SENTRY_NATIVE_BACKEND: none
          SENTRY_BACKEND: none

      - name: Create MSIX
        run: dart run msix:create --build-windows false

      - name: Rename MSIX with version
        shell: pwsh
        run: |
          $VER = "${{ needs.version.outputs.version }}"
          mkdir -p release-artifacts
          $msix = Get-ChildItem -Path "build/windows/x64/runner/Release" -Filter "*.msix" | Select-Object -First 1
          if ($msix) {
            Copy-Item $msix.FullName -Destination "release-artifacts/Oasis_${VER}.msix"
          }

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-msix
          path: release-artifacts/
          retention-days: 7


  # ── Release (only on tag push or manual trigger) ────────────────────────
  create-release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release)
    runs-on: ubuntu-latest
    needs: [version, build-android, build-ios, build-macos, build-windows]

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Flatten artifacts into staging
        run: |
          mkdir -p staging
          find release-artifacts -type f \( -name "*.apk" -o -name "*.ipa" -o -name "*.zip" -o -name "*.msix" \) -exec cp {} staging/ \;
          echo "=== Staged Release Files ==="
          ls -lh staging/

      - name: Generate Release Notes
        id: release-notes
        run: |
          VER="${{ needs.version.outputs.version }}"
          if [ -f versions.json ]; then
            jq -r '[.android.releaseNotes, .windows.releaseNotes, .macos.releaseNotes] | map(select(. != "")) | join("\n\n")' versions.json > release-notes.md 2>/dev/null
          fi
          if [ ! -s release-notes.md ]; then
            echo "Release v${VER}" > release-notes.md
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: Oasis v${{ needs.version.outputs.version }}
          body_path: release-notes.md
          files: staging/*
          generate_release_notes: false
          draft: false
          prerelease: false
