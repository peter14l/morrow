name: oasis
description: "A modern social media app for sharing moments and connecting with communities."

publish_to: 'none' 

version: 1.1.13

environment:
  sdk: ^3.8.0

dependencies:
  sentry_flutter: ^9.8.0
  flutter:
    sdk: flutter

  # UI Components
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  google_fonts: ^6.2.1
  flutter_screenutil: ^5.9.3
  image_picker: ^1.0.7
  image_cropper: ^11.0.0
  shimmer: ^3.0.0
  flutter_animate: ^4.5.0
  photo_view: ^0.15.0
