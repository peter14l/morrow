  # State Management
  provider: ^6.1.1
  
  # Navigation
  go_router: ^13.2.5
  app_links: ^6.3.2

  # UI Utils
  visibility_detector: ^0.4.0+2
  
  # Network
  dio: ^5.4.0
  http: ^1.1.0
  
  # Local Storage & Utils
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.1
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.0+2
  sqlite3: ^2.4.2
  sqlite3_flutter_libs: ^0.5.24
  url_launcher: ^6.2.2
  share_plus: ^7.2.1
  timeago: ^3.6.3
  flutter_local_notifications: ^19.5.0
  firebase_core: ^4.6.0
  firebase_messaging: 16.1.3
  firebase_analytics: ^12.2.0
  google_sign_in_all_platforms: ^1.1.0
  
  # Utils
  intl: 0.20.2
  uuid: ^4.2.2
  crypto: ^3.0.3

  # Additional Media & Files
  file_picker: ^8.0.0
  video_player: ^2.8.2
  video_player_win: ^2.3.1
  chewie: ^1.7.4

  # Voice Recording & Playback (disabled for Windows compatibility)
  record: ^6.1.2
  audioplayers: ^6.5.1

  # Location Services
  geolocator: ^10.1.0
  google_maps_flutter: ^2.5.3

  # Media Display
  flutter_cache_manager: ^3.3.1

  # UI Components for Messaging
  flutter_colorpicker: ^1.0.3

  # File Utilities
  mime: ^1.0.4
  open_filex: ^4.3.4
  flutter_image_compress: ^2.1.0
  path: ^1.8.3

  # Encryption & Security
  encrypt: ^5.0.3
  screen_protector: 1.5.1
