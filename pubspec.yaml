  libsignal_protocol_dart: 0.8.0
  palette_generator: ^0.3.3+4
  basic_utils: ^5.7.0
  pointycastle: ^3.9.1
  navigation_bar_m3e: ^0.1.1
  flutter_staggered_grid_view: ^0.7.0
  any_link_preview: ^3.0.3
  sensors_plus: ^4.0.2  # Gyroscope for Pulse Map parallax
  fluentui_system_icons: ^1.1.273
  local_auth: ^3.0.1
  flutter_webrtc: 1.4.0
  permission_handler: ^11.3.1
  audio_session: ^0.1.21
  receive_sharing_intent: ^1.8.1
  emoji_picker_flutter: ^4.4.0
  giphy_get: ^3.6.1+1
  universal_io: ^2.3.1
  dynamic_color: ^1.8.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0
  package_info_plus: ^8.0.0
  razorpay_flutter: ^1.3.7
  integration_test:
    sdk: flutter
  purchases_flutter: ^9.16.1
  webview_flutter: ^4.10.0
  webview_windows: ^0.4.0
  camera: ^0.12.0+1
  fluent_ui: ^4.15.1
  flutter_callkit_incoming: ^3.0.0
  livekit_client: 2.8.1
  flutter_background: 1.3.0
  ffi: ^2.2.0
  confetti: ^0.8.0

dev_dependencies:
  msix: ^3.16.1
  plugin_platform_interface: ^2.1.8
  video_player_platform_interface: ^6.2.2
  sentry_dart_plugin: ^3.2.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.15.0
  flutter_launcher_icons: ^0.13.1
  mockito: ^5.6.4
  test: ^1.24.10
  freezed: ^3.2.5
  json_serializable: ^6.13.1

msix_config:
  display_name: OasisApp
  publisher_display_name: OasisApp
  publisher: CN=95D0DA2B-7A5E-492D-BF38-F13FA12E0899
  identity_name: NoteSpark.OasisApp
  msix_version: 1.1.13.0
  logo_path: assets/images/logo.png
  capabilities: internetClient, location, microphone, webcam
  architecture: x64
  generate_certificate: false
  install_certificate: true
  certificate_path: certs/oasisapp.pfx
  certificate_password: 2008

dependency_overrides:
  liquid_glass_renderer:
    path: ./plugins/flutter_liquid_glass/packages/liquid_glass_renderer
  fluent_ui:
    path: ./fluent_ui
  flutter_secure_storage_windows:
    path: ./stubs/flutter_secure_storage_windows
  flutter_local_notifications_windows:
    path: ./stubs/flutter_local_notifications_windows
  protobuf: ^6.0.0
  pointycastle: ^4.0.0
  flutter_webrtc: 1.5.2



flutter:
  uses-material-design: true

  fonts:
    - family: Open Dyslexic
      fonts:
        - asset: assets/fonts/opendyslexic/OpenDyslexic-Regular.ttf

  # Assets including .env file
  assets:
    # .env intentionally omitted - injected at build time
    - assets/images/
    - assets/svgs/
    - assets/audio/
    - assets/audio/standardringtone.mp3
    - assets/fonts/opendyslexic/

sentry:
  upload_debug_symbols: true
  upload_source_maps: true
  project: oasis
  org: cresca
